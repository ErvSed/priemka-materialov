# The portal itself is hosted on GitHub Pages. The old server-side
# static mirror redirects there; /priemka-api/ remains on this server.
location = /priemka {
    return 301 https://ervsed.github.io/priemka-materialov/;
}

location /priemka/ {
    return 301 https://ervsed.github.io/priemka-materialov/;
}
